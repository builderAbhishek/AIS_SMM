<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" width="100%" height="100%">
  <!-- Container with fine border -->
  <rect width="500" height="500" rx="20" fill="#0A0E17" stroke="#1F2A3E" stroke-width="2"/>
  
  <!-- Subtle Gradient Accent -->
  <circle cx="420" cy="80" r="140" fill="rgba(255,94,30,0.08)" filter="blur(40px)"/>

  <!-- Watermark / Label Requirement -->
  <rect x="32" y="32" width="136" height="24" rx="6" fill="rgba(255,94,30,0.2)" stroke="#FF661F" stroke-width="1"/>
  <text x="40" y="48" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1">SAMPLE CREATIVE</text>

  <!-- Commercial Tag -->
  <rect x="340" y="32" width="128" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="350" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">OFFER CAMPAIGN</text>

  <!-- Category & Eyebrow -->
  <text x="32" y="94" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SUMMER ADMISSIONS • K-12 ACADEMY</text>

  <!-- Offer Title -->
  <text x="32" y="136" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700">Pre-Term Robotics &amp; STEM</text>
  <text x="32" y="170" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700">Scholarship Assessment</text>

  <!-- Transparent Details Box -->
  <rect x="32" y="195" width="436" height="160" rx="14" fill="#121927" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <text x="52" y="230" fill="#94A3B8" font-family="sans-serif" font-size="13">What is included:</text>
  <text x="52" y="258" fill="#F8FAFC" font-family="sans-serif" font-size="13">✓ 60-Minute Practical Coding &amp; Logic Evaluation</text>
  <text x="52" y="284" fill="#F8FAFC" font-family="sans-serif" font-size="13">✓ One-on-One Counseling with Head of Academics</text>
  <text x="52" y="310" fill="#F8FAFC" font-family="sans-serif" font-size="13">✓ Up to 40% Merit Concession for Top 10 Percentile</text>
  <text x="52" y="336" fill="#64748B" font-family="sans-serif" font-size="11">Limited to first 50 registered student slots in Delhi NCR</text>

  <!-- Direct WhatsApp Call To Action -->
  <rect x="32" y="385" width="436" height="68" rx="14" fill="linear-gradient(135deg, #FF661F 0%, #FF8533 100%)"/>
  <text x="95" y="416" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Send WhatsApp Message To Register</text>
  <text x="135" y="438" fill="rgba(255,255,255,0.9)" font-family="sans-serif" font-size="12">Type "STEM" for immediate test date confirmation ↗</text>
</svg>
