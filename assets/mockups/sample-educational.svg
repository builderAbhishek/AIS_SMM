<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" width="100%" height="100%">
  <!-- Container with fine border -->
  <rect width="500" height="500" rx="20" fill="#0C101A" stroke="#1E283C" stroke-width="2"/>
  
  <!-- Watermark / Label Requirement -->
  <rect x="32" y="32" width="136" height="24" rx="6" fill="rgba(255,94,30,0.2)" stroke="#FF661F" stroke-width="1"/>
  <text x="40" y="48" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1">SAMPLE CREATIVE</text>

  <!-- Authority Indicator -->
  <rect x="340" y="32" width="128" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="350" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">AUTHORITY ASSET</text>

  <!-- Content Job Tag -->
  <text x="32" y="94" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CLINICAL EDUCATION • DENTISTRY</text>

  <!-- Main Headline -->
  <text x="32" y="132" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">Root Canal vs Dental Implant:</text>
  <text x="32" y="160" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="500">When does saving your natural tooth make sense?</text>

  <!-- Infographic Comparison Matrix Mock -->
  <rect x="32" y="185" width="210" height="180" rx="12" fill="#131B2A" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="48" y="215" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">ROOT CANAL (RCT)</text>
  <text x="48" y="240" fill="#E2E8F0" font-family="sans-serif" font-size="12">✓ Preserves natural root</text>
  <text x="48" y="265" fill="#E2E8F0" font-family="sans-serif" font-size="12">✓ Completed in 1-2 visits</text>
  <text x="48" y="290" fill="#E2E8F0" font-family="sans-serif" font-size="12">✓ Natural chewing tactile feel</text>
  <text x="48" y="325" fill="#94A3B8" font-family="sans-serif" font-size="11">Best if root integrity > 60%</text>

  <rect x="258" y="185" width="210" height="180" rx="12" fill="#131B2A" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="274" y="215" fill="#60A5FA" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">TITANIUM IMPLANT</text>
  <text x="274" y="240" fill="#E2E8F0" font-family="sans-serif" font-size="12">✓ Replaces fractured roots</text>
  <text x="274" y="265" fill="#E2E8F0" font-family="sans-serif" font-size="12">✓ 25+ year durability</text>
  <text x="274" y="290" fill="#E2E8F0" font-family="sans-serif" font-size="12">✓ Prevents jawbone loss</text>
  <text x="274" y="325" fill="#94A3B8" font-family="sans-serif" font-size="11">Best for cracked roots</text>

  <!-- Clear CTA Bar -->
  <rect x="32" y="390" width="436" height="65" rx="12" fill="#182234" stroke="rgba(255,94,30,0.3)" stroke-width="1"/>
  <circle cx="62" cy="422" r="16" fill="rgba(255,94,30,0.2)"/>
  <path d="M58 422L62 426L68 418" stroke="#FF8533" stroke-width="2" stroke-linecap="round"/>
  <text x="90" y="416" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Have lingering tooth discomfort?</text>
  <text x="90" y="436" fill="#94A3B8" font-family="sans-serif" font-size="12">Send your X-Ray report on WhatsApp for clinical opinion</text>
  <text x="405" y="426" fill="#FF8533" font-family="sans-serif" font-size="16">→</text>
</svg>
