<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" width="100%" height="100%">
  <!-- Container with fine border -->
  <rect width="500" height="500" rx="20" fill="#0E1422" stroke="#1F2A3E" stroke-width="2"/>
  
  <!-- Subtle Grid -->
  <line x1="0" y1="100" x2="500" y2="100" stroke="rgba(255,255,255,0.04)"/>
  <line x1="0" y1="400" x2="500" y2="400" stroke="rgba(255,255,255,0.04)"/>
  <line x1="100" y1="0" x2="100" y2="500" stroke="rgba(255,255,255,0.04)"/>
  <line x1="400" y1="0" x2="400" y2="500" stroke="rgba(255,255,255,0.04)"/>

  <!-- Watermark / Label Requirement -->
  <rect x="32" y="32" width="136" height="24" rx="6" fill="rgba(255,94,30,0.2)" stroke="#FF661F" stroke-width="1"/>
  <text x="40" y="48" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1">SAMPLE CREATIVE</text>

  <!-- Slide Indicator -->
  <rect x="390" y="32" width="78" height="24" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="404" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">SLIDE 02/06</text>

  <!-- Content Job Tag -->
  <text x="32" y="98" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">EDUCATION • DECISION SUPPORT</text>

  <!-- Headline -->
  <text x="32" y="140" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">3 Structural Defects You Cannot</text>
  <text x="32" y="172" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">See on a Property Brochure</text>

  <!-- Card Block 1 -->
  <rect x="32" y="205" width="436" height="68" rx="10" fill="#141C2E" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <circle cx="58" cy="239" r="14" fill="rgba(255,94,30,0.15)"/>
  <text x="53" y="244" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">01</text>
  <text x="86" y="232" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">Load-Bearing Alterations</text>
  <text x="86" y="252" fill="#94A3B8" font-family="sans-serif" font-size="12">Hidden internal wall removals that compromise seismic compliance.</text>

  <!-- Card Block 2 -->
  <rect x="32" y="285" width="436" height="68" rx="10" fill="#141C2E" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <circle cx="58" cy="319" r="14" fill="rgba(255,94,30,0.15)"/>
  <text x="53" y="324" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">02</text>
  <text x="86" y="312" fill="#F8FAFC" font-family="sans-serif" font-size="14" font-weight="600">Basement Drainage Gradients</text>
  <text x="86" y="332" fill="#94A3B8" font-family="sans-serif" font-size="12">Sub-surface seepage causing long-term foundation efflorescence.</text>

  <!-- Bottom Nav / Swipe Cue -->
  <line x1="32" y1="385" x2="468" y2="385" stroke="rgba(255,255,255,0.08)"/>
  <text x="32" y="420" fill="#64748B" font-family="sans-serif" font-size="12">Designed for high-retention save rates</text>
  
  <text x="360" y="420" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">SWIPE LEFT →</text>
  
  <!-- Carousel Dots Indicator -->
  <circle cx="225" cy="445" r="4" fill="#64748B"/>
  <circle cx="240" cy="445" r="5" fill="#FF661F"/>
  <circle cx="255" cy="445" r="4" fill="#64748B"/>
  <circle cx="270" cy="445" r="4" fill="#64748B"/>
  <circle cx="285" cy="445" r="4" fill="#64748B"/>
  <circle cx="300" cy="445" r="4" fill="#64748B"/>
