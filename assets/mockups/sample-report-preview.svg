<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none" width="100%" height="100%">
  <!-- Outer Dashboard Frame -->
  <rect width="800" height="520" rx="20" fill="#0C101A" stroke="#1E283C" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="800" height="60" rx="20" fill="#111726"/>
  <rect x="24" y="18" width="12" height="12" rx="3" fill="#EF4444"/>
  <rect x="42" y="18" width="12" height="12" rx="3" fill="#F59E0B"/>
  <rect x="60" y="18" width="12" height="12" rx="3" fill="#10B981"/>
  
  <!-- Watermark / Label Requirement -->
