<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" width="100%" height="100%">
  <!-- Container with fine border -->
  <rect width="500" height="500" rx="20" fill="#0C101B" stroke="#1E283D" stroke-width="2"/>

  <!-- Watermark / Label Requirement -->
  <rect x="32" y="32" width="136" height="24" rx="6" fill="rgba(255,94,30,0.2)" stroke="#FF661F" stroke-width="1"/>
  <text x="40" y="48" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" letter-spacing="1">SAMPLE CREATIVE</text>

  <!-- Authenticity Tag -->
  <rect x="340" y="32" width="128" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="350" y="48" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">AUTHENTICITY</text>

  <!-- Category & Eyebrow -->
  <text x="32" y="94" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">BEHIND THE SCENES • HOSPITALITY</text>

  <!-- Headline -->
  <text x="32" y="132" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">"5:45 AM: Sourcing Before the Sun"</text>
  <text x="32" y="160" fill="#94A3B8" font-family="sans-serif" font-size="14">Why our head chef visits the organic mandi in person every Tuesday.</text>

  <!-- Storyboard Mockup Window -->
  <rect x="32" y="185" width="436" height="195" rx="14" fill="#141C2C" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  
  <!-- Mini camera view & timestamps -->
  <rect x="48" y="205" width="80" height="24" rx="6" fill="rgba(255,0,0,0.2)"/>
  <circle cx="58" cy="217" r="4" fill="#EF4444"/>
  <text x="68" y="222" fill="#EF4444" font-family="monospace" font-size="11" font-weight="700">REC 4K</text>
  <text x="360" y="222" fill="#94A3B8" font-family="monospace" font-size="12">05:48:12 IST</text>

  <!-- Frame Breakdown -->
  <text x="48" y="260" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Scene 01: Hand-selecting heirloom tomatoes</text>
  <text x="48" y="282" fill="#94A3B8" font-family="sans-serif" font-size="12">Zero frozen purées. Zero mass-market bulk cans.</text>
  
  <text x="48" y="320" fill="#F8FAFC" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Scene 02: Kitchen sanitization &amp; prep setup</text>
  <text x="48" y="342" fill="#94A3B8" font-family="sans-serif" font-size="12">Stainless steel prep counters sanitized at 70°C prior to service.</text>

  <!-- Outcome / Trust Statement -->
  <rect x="32" y="405" width="436" height="58" rx="10" fill="#182030" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="48" y="430" fill="#FF8533" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">PERCEPTION GOAL:</text>
  <text x="48" y="448" fill="#F8FAFC" font-family="sans-serif" font-size="13">Instill uncompromising trust in kitchen hygiene and ingredient integrity.</text>
</svg>
